name: CI — Awesome-OS Host Manager (Fleet, A/B Slots, Workspaces & MCP)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run all Host Manager, A/B Installer, MCP & workspaces:// tests
        run: node --test test/host-manager.test.mts test/ab-installer.test.mts test/mcp-and-fit.test.mts test/workspaces.test.mts
